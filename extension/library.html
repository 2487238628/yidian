<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一点 · 我的收藏</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">一点｜工作与学习的收藏回看工具</p>
        <h1>我的收藏</h1>
        <p class="intro">这里保存你收下的网页和选段。查看下次回看日期与四次相见进度；到期时，点击浏览器工具栏里的“一点”完成回看。</p>
      </div>
      <div class="tools" aria-label="记录工具">
        <button id="export" type="button">导出备份</button>
        <label class="button" for="import">导入备份</label>
        <input id="import" type="file" accept="application/json,.json">
      </div>
    </header>

    <section class="summary" aria-label="收藏概览">
      <div><strong id="total">0</strong><span>条收藏</span></div>
      <div><strong id="due">0</strong><span>今天待回看</span></div>
      <div><strong id="complete">0</strong><span>已完成 4 次相见</span></div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="records" class="records" aria-label="收藏记录"></section>
  </main>
  <template id="record-template">
    <article class="record">
      <div class="record-copy">
        <p class="record-state"></p>
        <h2></h2>
        <p class="record-meta"></p>
        <p class="record-excerpt" hidden></p>
      </div>
      <div class="progress" aria-label="再次查看进度"><span></span></div>
      <div class="record-actions">
        <button class="open" type="button">打开原网页</button>
        <button class="delete" type="button">删除</button>
      </div>
    </article>
  </template>
  <script src="library.js" type="module"></script>
</body>
</html>

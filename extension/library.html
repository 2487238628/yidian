<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>12730 · 我的回访</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">12730 · 文档回访伙伴</p>
        <h1>我的回访</h1>
        <p class="intro">先开始，再在 1、2、7、30 天轻轻回来。</p>
      </div>
      <div class="tools" aria-label="记录工具">
        <button id="export" type="button">导出备份</button>
        <label class="button" for="import">导入备份</label>
        <input id="import" type="file" accept="application/json,.json">
      </div>
    </header>

    <section class="summary" aria-label="回访概览">
      <div><strong id="total">0</strong><span>份记录</span></div>
      <div><strong id="due">0</strong><span>今天可回访</span></div>
      <div><strong id="complete">0</strong><span>已经长成</span></div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="records" class="records" aria-label="文档记录"></section>
  </main>
  <template id="record-template">
    <article class="record">
      <div class="record-copy">
        <p class="record-state"></p>
        <h2></h2>
        <p class="record-meta"></p>
      </div>
      <div class="progress" aria-label="回访进度"><span></span></div>
      <div class="record-actions">
        <button class="open" type="button">打开原文</button>
        <button class="delete" type="button">删除</button>
      </div>
    </article>
  </template>
  <script src="library.js" type="module"></script>
</body>
</html>
